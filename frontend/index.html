<!DOCTYPE html>

<html lang="en">

  <head>

    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Kaizen Ideas Management Portal | Kauvery</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">

    <script>

      tailwind.config = {

        theme: {

          extend: {

            colors: {

              kauvery: {

                purple: '#962067',

                violet: '#A1238E',

                pink: '#EE2D67',

                yellow: '#FFE73F',

                darkGrey: '#58595B',

                red: '#ED1C24',

                orange: '#F26522',

                yellowOrange: '#FD9621',

                peach: '#FAA95F',

                lightGrey: '#939598',

                surface: {

                  page: '#f8f4fc',

                  elevated: '#ffffff',

                  muted: '#f3eef8',

                  tint: '#faf5fb',

                },

              }

            },

            fontFamily: {

              sans: ['Poppins', 'sans-serif'],

            },

            boxShadow: {

              'kauvery-soft': '0 12px 40px -12px rgba(150, 32, 103, 0.14)',

              'kauvery-card': '0 4px 28px -6px rgba(162, 50, 147, 0.12), 0 0 0 1px rgba(150, 32, 103, 0.06)',

              'kauvery-glow': '0 0 48px -8px rgba(238, 45, 103, 0.18)',

            },

            backgroundImage: {

              'kauvery-mesh':

                'radial-gradient(at 12% 18%, rgba(150,32,103,0.10) 0px, transparent 50%), radial-gradient(at 88% 12%, rgba(161,35,142,0.08) 0px, transparent 45%), radial-gradient(at 50% 90%, rgba(238,45,103,0.06) 0px, transparent 55%)',

            },

            keyframes: {

              fadeIn: {

                '0%': { opacity: '0', transform: 'translateY(8px)' },

                '100%': { opacity: '1', transform: 'translateY(0)' },

              },

            },

            animation: {

              'fade-in': 'fadeIn 0.5s ease-out both',

            },

          }

        }

      }

    </script>

    <style>

      @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap');

      body {

        font-family: 'Poppins', sans-serif;

        min-height: 100vh;

        color: #1e293b;

        background-color: #f8f4fc;

        background-image:

          radial-gradient(ellipse 120% 80% at 0% -10%, rgba(150, 32, 103, 0.10), transparent 52%),

          radial-gradient(ellipse 90% 60% at 100% 0%, rgba(161, 35, 142, 0.08), transparent 50%),

          radial-gradient(ellipse 70% 50% at 50% 100%, rgba(238, 45, 103, 0.06), transparent 46%),

          radial-gradient(ellipse 50% 40% at 70% 40%, rgba(250, 169, 95, 0.05), transparent 50%),

          linear-gradient(168deg, #fdf8fc 0%, #f8f4fc 45%, #f3eef8 100%);

      }

      ::-webkit-scrollbar {

        width: 9px;

        height: 9px;

      }

      ::-webkit-scrollbar-track {

        background: rgba(150, 32, 103, 0.05);

        border-radius: 6px;

      }

      ::-webkit-scrollbar-thumb {

        background: linear-gradient(180deg, #d4a5c8, #962067);

        border-radius: 6px;

        border: 2px solid rgba(255, 255, 255, 0.85);

      }

      ::-webkit-scrollbar-thumb:hover {

        background: linear-gradient(180deg, #b87cad, #7c1d5a);

      }

      .kaizen-template-capture-root textarea {

        overflow-y: hidden !important;

        resize: none !important;

      }

      @supports (field-sizing: content) {

        .kaizen-template-capture-root textarea {

          field-sizing: content;

        }

      }

    </style>

  <script type="importmap">

{

  "imports": {

    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",

    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",

    "react/": "https://aistudiocdn.com/react@^19.2.0/",

    "react": "https://aistudiocdn.com/react@^19.2.0",

    "recharts": "https://aistudiocdn.com/recharts@^3.4.1"

  }

}

</script>

<link rel="stylesheet" href="/index.css">

</head>

    <div id="root"></div>

  <script type="module" src="/src/main.tsx"></script>

</body>

</html>
